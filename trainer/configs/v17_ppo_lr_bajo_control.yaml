# v17 (control de v16): lote chico de siempre (4 workers × 160 = 640, minibatch 128) con lr 5e-5 ÷ 16 ≈ 3,1e-6.
# Desde Day8/latest.pt (partida 340), 250 partidas nuevas, 4 workers. Misma receta que Day9/Day11 salvo el lr.
# Pregunta: en teoría, lote ×16 con el mismo lr (v16) se parece a lr ÷16 con el lote chico. Comparando ambos a las mismas partidas:
#   - los dos estables → lo que importa es el tamaño efectivo del paso (alcanza con bajar mucho el lr);
#   - v16 estable y v17 colapsa → el lote grande aporta más que bajar el lr;
#   - los dos colapsan → la señal está sesgada (crítico, γ, recompensa).
# Evaluación sin sesgo cada 120 actualizaciones (~55 partidas, 40 partidas cada una) y parada si dos seguidas dan < 45 %.
name: ppo_v17
seed: 0
device: auto          # auto = GPU (CUDA) si existe, si no CPU; cpu o cuda para forzar
workers: 4          # 4 de los 6 núcleos (menos carga nocturna)
low_priority: false  # prioridad normal: el motor no cede CPU a otros procesos
rollout_steps: 160     # 4 workers × 160 = 640 muestras por actualización (como Day9)
updates: 1000
rollout_mode: sync    # el asíncrono no ganó velocidad (Day6, ADR 0010): la red serializada era el límite
episodes: 590         # total absoluto: Day8 terminó en la partida 340, así que son 250 partidas nuevas
checkpoint_every: 40
eval:
  every: 120        # cada ~55 partidas
  episodes: 40      # cuota fija por worker (sin sesgo); ±15 puntos
env:
  map: Britannia
  bots: 20
  nations: 1
  difficulty: Easy
  decisionInterval: 10
  maxTicks: 18000
  grid: {h: 32, w: 64}
  samples: 4
  rewardTerritoryWeight: 0.40
  rewardAttackWeight: 0.08
  rewardEconomyWeight: 0.04
  rewardDefenseWeight: 0.05
  rewardMilestonesWeight: 0.06   # primera ciudad, puerto y fábrica (reward.md §2b)
  rewardTroopsWeight: 0.05       # tropas en la zona justa, ~42 % del máximo (reward.md §2c)
  territoryKnee: 0.15            # el primer 15 % del mapa paga el 35 % del presupuesto de territorio (reward.md §2)
  territoryKneeShare: 0.35
  # Sin diplomacia ni comercio: contra tribus no aportan (docs/specs/actions.md §4b).
  disabledActions: [alliance_request, alliance_reject, alliance_break, alliance_extend, embargo_start, embargo_stop,
                    embargo_all_start, embargo_all_stop, target_player, emoji, donate_gold, donate_troops,
                    cancel_attack, cancel_boat, delete_unit]
  maxStructures: {post: 4}       # los puestos de defensa solo pagan hasta 4 (reward.md §2)
# Bonus por tribu conquistada: máximo al empezar y 0 a partir del 50 % del run (docs/specs/reward.md §9).
conquest: {budget: 0.20, until: 0.5}
stop:               # parada automática (ver trainer/README.md)
  clipfrac: 0.03
  window: 20
  min_updates: 30
  win_below: 0.3
  win_window: 30
  eval_below: 0.45    # dos evaluaciones sin sesgo seguidas bajo 45 % → parar
  eval_count: 2
model: {}
ppo:
  gamma: 0.997
  gae_lambda: 0.95
  clip: 0.2
  epochs: 3
  minibatch: 128
  lr: 0.0000031     # 5e-5 / 16, constante (lr_floor 1,0)
  ent_coef: 0.0076   # con episodes 590 arranca en ~0,0038, como Day9/Day11
  ent_coef_final: 0.001
  value_clip: 0.2     # por defecto (Day4)
  vf_coef: 0.5        # por defecto (Day4)
  lr_floor: 1.0       # sin decaimiento: se reanuda con el progreso en 289/339 y el lr caería a casi 0
