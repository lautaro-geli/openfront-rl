# Prueba del crítico (Day5): igual que ppo_naciones_estable pero con value_clip apagado (100) y vf_coef 1.0. Se reanuda desde Day4/ckpt_000400.pt.
# Motivo: en Day4 el crítico predecía ~0,17 con retornos reales de ~4 (EV 0,03 contra el retorno completo; un reajuste offline llega a 0,4–0,5).
# `episodes` es el total absoluto: se reanuda en la partida 188, así que 288 = 100 partidas nuevas.
# Etapa 2 estable (Day4): como ppo_naciones pero con lr 1e-4 (Day3 oscilaba: rachas de ~60 % de victorias y de 0 %) y evaluación de
# 10 partidas. Se reanuda desde Day3/ckpt_000175.pt. Etapa 2 del currículo: igual que ppo_base pero con 1 nación Easy además de las 20 tribus. Se reanuda desde un run de ppo_base
# (--resume). Medido con el checkpoint de Day2 (sin reentrenar): con 3 naciones Easy 0/4 victorias y 3 eliminaciones; con 1 nación 1/5.
name: ppo_critico
seed: 0
device: cpu
workers: null          # null = núcleos − 1 (5 en un i5-9400)
rollout_steps: 128     # 128 pasos × 5 partidas = 640 muestras por actualización
updates: 1000
episodes: 288         # duración del run en partidas de entrenamiento terminadas (anula `updates`)
checkpoint_every: 25
eval:
  every: 50
  episodes: 10
env:
  map: Britannia
  bots: 20
  nations: 1
  difficulty: Easy
  decisionInterval: 10
  maxTicks: 18000
  grid: {h: 32, w: 64}
  samples: 4
  rewardTerritoryWeight: 0.40
  rewardAttackWeight: 0.08
  rewardEconomyWeight: 0.04
  rewardDefenseWeight: 0.05
  rewardMilestonesWeight: 0.06   # primera ciudad, puerto y fábrica (reward.md §2b)
  rewardTroopsWeight: 0.05       # tropas en la zona justa, ~42 % del máximo (reward.md §2c)
  territoryKnee: 0.15            # el primer 15 % del mapa paga el 35 % del presupuesto de territorio (reward.md §2)
  territoryKneeShare: 0.35
  # Sin diplomacia ni comercio: contra tribus no aportan (docs/specs/actions.md §4b).
  disabledActions: [alliance_request, alliance_reject, alliance_break, alliance_extend, embargo_start, embargo_stop,
                    embargo_all_start, embargo_all_stop, target_player, emoji, donate_gold, donate_troops,
                    cancel_attack, cancel_boat, delete_unit]
  maxStructures: {post: 4}       # los puestos de defensa solo pagan hasta 4 (reward.md §2)
# Bonus por tribu conquistada: máximo al empezar y 0 a partir del 50 % del run (docs/specs/reward.md §9).
conquest: {budget: 0.20, until: 0.5}
model: {}
ppo:
  gamma: 0.997
  gae_lambda: 0.95
  clip: 0.2
  epochs: 3
  minibatch: 128
  lr: 0.00015       # el lr decae con el progreso (episodes_done/episodes): empezando en 188/288 queda ~5e-5, similar al inicio de Day4
  ent_coef: 0.01
  ent_coef_final: 0.001
  value_clip: 100.0   # Day4 usaba 0.2 (por defecto): el crítico no podía alcanzar retornos de ~4–14 en la escala de recompensa
  vf_coef: 1.0
