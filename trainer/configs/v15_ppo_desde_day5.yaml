# v15 (paso 2): reanudar desde el MEJOR modelo (Day5 ckpt_000620, 58 % en 64 partidas) y no desde Day8, con el bonus de conquista
# relativo de v13 (el único cambio que aguantó más) y lr 3e-5 (Day8, estable). Lo nuevo: evaluación sin sesgo dentro del run
# (40 partidas cada 50 actualizaciones, en las mismas actualizaciones que un checkpoint) y parada si dos evaluaciones seguidas
# dan < 45 %. Las victorias de entrenamiento están infladas y llegan tarde (Day9–Day14).
# Desde la partida 289 (Day5): 100 partidas nuevas → total 389. Evaluaciones en las act. 650, 700, 750 y 800 (aprox.).
# Éxito: alguna evaluación ≥ 60 % y que evalckpt (cmp1, 40 partidas) de ese checkpoint lo confirme. Si todas quedan ≤ 50 %, PPO desde
# un buen checkpoint no mejora con esta señal: pasar a GAE desacoplado / preentrenar el crítico (03-hipotesis, #4 y #13).
# Lanzar: --resume runs/Day5/ckpt_000620.pt --run-dir runs/Day15
name: ppo_v15
seed: 0
device: auto          # auto = GPU (CUDA) si existe, si no CPU; cpu o cuda para forzar
workers: 5          # 5 de los 6 núcleos (la PC queda justa: no usarla mientras entrena)
low_priority: false  # prioridad normal: el motor no cede CPU a otros procesos
rollout_steps: 128     # 5 workers × 128 = 640 muestras por actualización (como Day5)
updates: 1000
rollout_mode: sync    # el asíncrono no ganó velocidad (Day6, ADR 0010): la red serializada era el límite
episodes: 389         # total absoluto: Day5 ckpt_620 está en la partida 289, así que son 100 partidas nuevas
checkpoint_every: 25
eval:
  every: 50         # cada ~31 partidas de entrenamiento; coincide con un checkpoint (checkpoint_every 25)
  episodes: 40      # cuota fija por worker (sin sesgo); ±15 puntos
env:
  map: Britannia
  bots: 20
  nations: 1
  difficulty: Easy
  decisionInterval: 10
  maxTicks: 18000
  grid: {h: 32, w: 64}
  samples: 4
  rewardTerritoryWeight: 0.40
  rewardAttackWeight: 0.08
  rewardEconomyWeight: 0.04
  rewardDefenseWeight: 0.05
  rewardMilestonesWeight: 0.06   # primera ciudad, puerto y fábrica (reward.md §2b)
  rewardTroopsWeight: 0.05       # tropas en la zona justa, ~42 % del máximo (reward.md §2c)
  territoryKnee: 0.15            # el primer 15 % del mapa paga el 35 % del presupuesto de territorio (reward.md §2)
  territoryKneeShare: 0.35
  # Sin diplomacia ni comercio: contra tribus no aportan (docs/specs/actions.md §4b).
  disabledActions: [alliance_request, alliance_reject, alliance_break, alliance_extend, embargo_start, embargo_stop,
                    embargo_all_start, embargo_all_stop, target_player, emoji, donate_gold, donate_troops,
                    cancel_attack, cancel_boat, delete_unit]
  maxStructures: {post: 4}       # los puestos de defensa solo pagan hasta 4 (reward.md §2)
# Bonus por tribu conquistada: 0,20 al empezar y 0 al final de ESTE run (relativo, docs/specs/reward.md §9), como v13.
conquest: {budget: 0.20, until: 1.0, relative: true}
stop:               # parada automática por alarma de colapso (calibrada con Day5–Day10; ver trainer/README.md)
  clipfrac: 0.03      # media de `window` actualizaciones
  window: 20
  min_updates: 30
  win_below: 0.3      # victorias de entrenamiento de las últimas `win_window` partidas
  win_window: 30
  eval_below: 0.45    # dos evaluaciones sin sesgo seguidas bajo 45 % → parar
  eval_count: 2
model: {}
ppo:
  gamma: 0.997
  gae_lambda: 0.95
  clip: 0.2
  epochs: 3
  minibatch: 128
  lr: 0.00003       # constante (lr_floor 1,0), el de Day8
  ent_coef: 0.01
  ent_coef_final: 0.001
  value_clip: 0.2     # por defecto (Day4)
  vf_coef: 0.5        # por defecto (Day4)
  lr_floor: 1.0       # sin decaimiento: se reanuda con el progreso en 289/339 y el lr caería a casi 0
