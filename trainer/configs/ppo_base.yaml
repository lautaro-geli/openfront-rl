# PPO plano contra tribus (bots) en Britannia: banco de pruebas del pipeline. Pasar a World cuando la curva suba.
name: ppo_base
seed: 0
device: cpu
workers: null          # null = núcleos − 1 (5 en un i5-9400)
rollout_steps: 128     # 128 pasos × 5 partidas = 640 muestras por actualización
updates: 1000
checkpoint_every: 25
eval:
  every: 50
  episodes: 5
env:
  map: Britannia
  bots: 20
  nations: disabled
  difficulty: Easy
  decisionInterval: 10
  maxTicks: 6000
  grid: {h: 32, w: 64}
  samples: 4
  rewardTerritoryWeight: 0.40
  rewardAttackWeight: 0.15
  rewardEconomyWeight: 0.10
  rewardDefenseWeight: 0.05
model: {}
ppo:
  gamma: 0.997
  gae_lambda: 0.95
  clip: 0.2
  epochs: 3
  minibatch: 128
  lr: 0.0003
  ent_coef: 0.01
  ent_coef_final: 0.001
